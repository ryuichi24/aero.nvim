name: Task MCP adapter
on:
  push:
    paths: ['mcp/**', '.github/workflows/mcp.yml']
    tags: ['v*']
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Cross compile standalone executables
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          mkdir -p dist
          for TARGET in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64 windows-amd64; do
            OS=${TARGET%-*}
            ARCH=${TARGET#*-}
            SUFFIX=""
            if [ "$OS" = windows ]; then SUFFIX=.exe; fi
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags "-X main.version=$VERSION" -o "dist/aero-mcp-$VERSION-$TARGET$SUFFIX" ./cmd/aero-mcp
          done
          "./dist/aero-mcp-$VERSION-linux-amd64" --version
          mkdir -p dist/licenses
          go list -m -f '{{if .Dir}}{{.Dir}}{{end}}' all | while read -r DIR; do
            for LICENSE in "$DIR"/LICENSE* "$DIR"/COPYING* "$DIR"/NOTICE*; do
              if [ -f "$LICENSE" ]; then
                NAME=$(basename "$DIR")-$(basename "$LICENSE")
                cp "$LICENSE" "dist/licenses/$NAME"
              fi
            done
          done
          tar -czf dist/THIRD_PARTY_LICENSES.tar.gz -C dist licenses
          rm -r dist/licenses
          go list -m all > dist/DEPENDENCIES.txt
          (cd dist && sha256sum aero-mcp-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aero-mcp
          path: mcp/dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require matching published manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; m=json.load(open("mcp/release.json")); assert m["published"] and "v"+m["version"] == os.environ["TAG"]'
      - uses: actions/download-artifact@v4
        with:
          name: aero-mcp
          path: dist
      - name: Upload matching release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
